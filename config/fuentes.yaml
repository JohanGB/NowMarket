# Fuentes públicas que descarga `python -m mercado_al_dia.ingesta.descargar`.
#
# Cada fuente:
#   id            identificador único (sin espacios)
#   descripcion   texto libre
#   url           enlace exacto del archivo (salido de la página oficial indicada)
#   pagina_origen página oficial donde aparece publicado el enlace
#   destino       ruta relativa dentro de data/raw/ (se usa "/" también en Windows)
#   tipo          xlsx | zip | pdf | txt | csv  (sirve para validar que no llegó una página HTML de error)
#   activo        true/false. Las fuentes inactivas se ignoran.
#
# Revisión de enlaces: 11-nov-2026 (ver docs/fase0_datos.md).

descarga:
  tiempo_espera_s: 60          # tiempo máximo por intento
  reintentos: 3                # intentos totales por archivo
  espera_entre_reintentos_s: 5 # se duplica en cada reintento
  user_agent: "mercado-al-dia/0.1 (descarga de datos publicos; uso no comercial)"

fuentes:
  # ---------- SIPSA_P: series históricas de precios mayoristas (mensuales) ----------
